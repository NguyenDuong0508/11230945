name: Part 1 validation
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --junitxml=/tmp/part1-tests.xml
      - run: python -c "import xml.etree.ElementTree as E; r=E.parse('/tmp/part1-tests.xml'); s=r.findall('.//testsuite'); assert s and sum(int(t.get('skipped',0)) for t in s)==0 and sum(int(t.get('tests',0)) for t in s)>0"
